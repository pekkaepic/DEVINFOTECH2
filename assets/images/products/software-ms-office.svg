<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <linearGradient id="officeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D83B01" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>
  <rect width="500" height="350" rx="12" fill="#FFF7ED" />
  
  <rect x="25" y="25" width="120" height="26" rx="13" fill="#EA580C" fill-opacity="0.15" />
  <text x="85" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#C2410C">LIFETIME LICENSE</text>

  <!-- Software Box Graphic -->
  <g transform="translate(160, 60)" filter="url(#softShadow)">
    <rect width="180" height="230" rx="10" fill="url(#officeGrad)" />
    
    <!-- Microsoft 4 color square -->
    <g transform="translate(30, 30)">
      <rect x="0" y="0" width="10" height="10" fill="#F25022" />
      <rect x="13" y="0" width="10" height="10" fill="#7FBA00" />
      <rect x="0" y="13" width="10" height="10" fill="#00A4EF" />
      <rect x="13" y="13" width="10" height="10" fill="#FFB900" />
    </g>

    <text x="65" y="48" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Microsoft</text>
    <text x="30" y="95" font-family="sans-serif" font-size="22" font-weight="900" fill="#FFFFFF">Office 2021</text>
    <text x="30" y="118" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFEDD5">Professional Plus</text>

    <!-- App Icons Pills -->
    <g transform="translate(30, 145)">
      <rect x="0" y="0" width="24" height="24" rx="4" fill="#185ABD" />
      <text x="12" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">W</text>
      
      <rect x="30" y="0" width="24" height="24" rx="4" fill="#107C41" />
      <text x="42" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">X</text>

      <rect x="60" y="0" width="24" height="24" rx="4" fill="#C43E1C" />
      <text x="72" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">P</text>

      <rect x="90" y="0" width="24" height="24" rx="4" fill="#0078D4" />
      <text x="102" y="16" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">O</text>
    </g>
    
    <text x="30" y="200" font-family="sans-serif" font-size="10" fill="#FED7AA">1 PC • 100% Genuine Key</text>
  </g>
</svg>
