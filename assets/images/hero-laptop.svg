<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="heroGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background Decorative Grid & Glow -->
  <circle cx="400" cy="300" r="260" fill="url(#heroGlow)" />
  <circle cx="650" cy="150" r="90" fill="#2563EB" opacity="0.08" />
  <circle cx="150" cy="450" r="110" fill="#F59E0B" opacity="0.08" />

  <!-- Main Laptop Group -->
  <g transform="translate(100, 70)" filter="url(#cardShadow)">
    <!-- Screen Lid Back & Bezel -->
    <rect x="70" y="40" width="460" height="290" rx="16" fill="url(#bezelGrad)" stroke="#64748B" stroke-width="1.5" />
    <!-- Inner Screen Display -->
    <rect x="85" y="55" width="430" height="260" rx="6" fill="url(#screenGrad)" />
    
    <!-- Screen Content: Modern Tech UI Graphic -->
    <circle cx="300" cy="140" r="4" fill="#38BDF8" opacity="0.8" />
    <circle cx="300" cy="62" r="3" fill="#64748B" />
    
    <!-- Dashboard Mockup on Laptop Screen -->
    <!-- Top Bar -->
    <rect x="100" y="70" width="400" height="20" rx="4" fill="#1E293B" />
    <circle cx="112" cy="80" r="3.5" fill="#EF4444" />
    <circle cx="122" cy="80" r="3.5" fill="#F59E0B" />
    <circle cx="132" cy="80" r="3.5" fill="#10B981" />
    <rect x="160" y="75" width="160" height="10" rx="3" fill="#334155" />

    <!-- Screen Content Cards -->
    <rect x="100" y="102" width="120" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="112" y="125" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">QC PASS STATUS</text>
    <text x="112" y="152" font-family="sans-serif" font-size="22" font-weight="800" fill="#10B981">100%</text>
    <text x="112" y="172" font-family="sans-serif" font-size="9" fill="#64748B">30-Point Checked</text>

    <rect x="230" y="102" width="130" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="242" y="125" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">AVG SAVINGS</text>
    <text x="242" y="152" font-family="sans-serif" font-size="22" font-weight="800" fill="#F59E0B">55-60%</text>
    <text x="242" y="172" font-family="sans-serif" font-size="9" fill="#64748B">vs Brand New</text>

    <rect x="370" y="102" width="130" height="85" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="382" y="125" font-family="sans-serif" font-size="10" font-weight="700" fill="#94A3B8">WARRANTY</text>
    <text x="382" y="152" font-family="sans-serif" font-size="20" font-weight="800" fill="#38BDF8">6 Mo.</text>
    <text x="382" y="172" font-family="sans-serif" font-size="9" fill="#64748B">Full Testing Cover</text>

    <!-- Code / Wave Graph on Screen -->
    <path d="M 100 240 Q 180 200, 240 250 T 360 210 T 500 240 L 500 295 L 100 295 Z" fill="url(#heroGlow)" opacity="0.6" />
    <path d="M 100 240 Q 180 200, 240 250 T 360 210 T 500 240" fill="none" stroke="url(#codeGrad)" stroke-width="3" />

    <!-- Screen Glass Shine -->
    <polygon points="85,55 350,55 180,315 85,315" fill="#ffffff" opacity="0.04" />

    <!-- Laptop Base / Keyboard deck (Perspective) -->
    <path d="M 20 330 L 580 330 C 595 330, 605 342, 595 352 L 530 388 C 522 393, 510 395, 490 395 L 110 395 C 90 395, 78 393, 70 388 L 5 352 C -5 342, 5 330, 20 330 Z" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <!-- Trackpad & Notch -->
    <rect x="250" y="340" width="100" height="42" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <rect x="270" y="332" width="60" height="3" rx="1.5" fill="#64748B" />
  </g>

  <!-- Floating Badge: Quality Certified -->
  <g transform="translate(60, 280)" filter="url(#cardShadow)">
    <rect width="210" height="74" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="36" cy="37" r="22" fill="#10B981" opacity="0.15" />
    <circle cx="36" cy="37" r="16" fill="#10B981" />
    <path d="M 31 37 L 35 41 L 43 32" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="32" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">Grade A+ Certified</text>
    <text x="68" y="49" font-family="sans-serif" font-size="11" fill="#64748B">Original OEM Parts</text>
  </g>

  <!-- Floating Badge: Ready to Ship -->
  <g transform="translate(520, 100)" filter="url(#cardShadow)">
    <rect width="200" height="70" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="36" cy="35" r="20" fill="#2563EB" opacity="0.12" />
    <circle cx="36" cy="35" r="14" fill="#2563EB" />
    <text x="36" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">₹</text>
    <text x="66" y="30" font-family="sans-serif" font-size="13" font-weight="700" fill="#1E293B">Best Price Promise</text>
    <text x="66" y="47" font-family="sans-serif" font-size="11" fill="#64748B">Starting at ₹19,999</text>
  </g>
</svg>
