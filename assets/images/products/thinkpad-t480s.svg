<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
  <defs>
    <linearGradient id="tpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="tpChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <filter id="lapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
  </defs>
  <rect width="500" height="350" rx="12" fill="url(#tpBg)" />
  
  <!-- Badge -->
  <rect x="25" y="25" width="100" height="26" rx="13" fill="#10B981" fill-opacity="0.15" />
  <text x="75" y="42" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#047857">GRADE A+</text>

  <g transform="translate(50, 40)" filter="url(#lapShadow)">
    <!-- Screen -->
    <rect x="50" y="20" width="300" height="190" rx="10" fill="url(#tpChassis)" stroke="#404040" stroke-width="1.5" />
    <rect x="60" y="30" width="280" height="170" rx="4" fill="#0A0F1D" />
    
    <!-- ThinkPad Screen Wall -->
    <path d="M 60 30 L 220 30 L 120 200 L 60 200 Z" fill="#ffffff" opacity="0.04" />
    <circle cx="200" cy="115" r="30" fill="#EF4444" opacity="0.1" />
    <text x="200" y="112" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">ThinkPad</text>
    <text x="200" y="130" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#94A3B8">T480s • Core i5 8th Gen</text>

    <!-- Base -->
    <path d="M 10 210 L 390 210 C 398 210, 405 218, 398 226 L 350 252 C 345 255, 335 258, 320 258 L 80 258 C 65 258, 55 255, 50 252 L 2 226 C -5 218, 2 210, 10 210 Z" fill="#171717" />
    
    <!-- Red TrackPoint nipple -->
    <circle cx="200" cy="224" r="3.5" fill="#EF4444" />
    <!-- Trackpad -->
    <rect x="165" y="235" width="70" height="18" rx="2" fill="#262626" stroke="#404040" stroke-width="0.5" />
    <!-- Trackpad click buttons -->
    <rect x="175" y="230" width="16" height="4" rx="1" fill="#EF4444" />
    <rect x="193" y="230" width="14" height="4" rx="1" fill="#404040" />
    <rect x="209" y="230" width="16" height="4" rx="1" fill="#EF4444" />
  </g>
</svg>
