<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 75" width="340" height="75">
  <defs>
    <linearGradient id="devBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2E8" />
      <stop offset="100%" stop-color="#0072CE" />
    </linearGradient>
    <linearGradient id="devGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70B817" />
      <stop offset="100%" stop-color="#559608" />
    </linearGradient>
  </defs>

  <!-- Logo Mark (Sprout in Blue Crescent) -->
  <g transform="translate(6, 4)">
    <!-- Blue Crescent Base -->
    <path d="M 18,36 C 18,52 32,62 48,58 C 62,54 66,42 66,35 C 66,31 63,30 60,32 C 55,36 49,43 38,43 C 27,43 23,34 23,28 C 23,26 20,25 19,27 C 18,30 18,33 18,36 Z" fill="url(#devBlueGrad)" />
    
    <!-- Light Blue Leaf Accent inside circle -->
    <path d="M 31,39 C 33,48 44,52 49,48 C 45,43 38,36 31,39 Z" fill="#38BDF8" opacity="0.9" />

    <!-- Green Human / Sprout Head -->
    <circle cx="34" cy="14" r="5" fill="url(#devGreenGrad)" />

    <!-- Main Green Leaf Body (Sweeping upwards) -->
    <path d="M 43,45 C 41,36 34,26 21,17 C 23,23 31,31 32,45 C 34,48 40,49 43,45 Z" fill="url(#devGreenGrad)" />
    <path d="M 21,17 C 29,20 38,28 39,40 C 37,34 32,26 21,17 Z" fill="#84CC16" opacity="0.8" />

    <!-- Upper Right Leaf / Branch -->
    <path d="M 39,26 C 40,19 41,10 42,2 C 39,8 39,17 39,26 Z" fill="#559608" />

    <!-- Right Side Floating Leaf Splash -->
    <path d="M 47,24 C 54,23 60,20 63,16 C 59,20 54,23 47,24 Z" fill="#0084D6" />
    <path d="M 49,27 C 56,26 62,23 64,19 C 61,22 55,25 49,27 Z" fill="#0072CE" />
  </g>

  <!-- Typography -->
  <!-- "Dev Infotech" -->
  <text x="82" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" fill="#06213D" letter-spacing="-0.5">
    Dev <tspan fill="#0084D6">Infotech</tspan>
  </text>

  <!-- Divider lines -->
  <line x1="82" y1="47" x2="108" y2="47" stroke="#CBD7E2" stroke-width="1" />
  <line x1="300" y1="47" x2="326" y2="47" stroke="#CBD7E2" stroke-width="1" />

  <!-- Tagline: TECHNOLOGY FOR EVERY NEED -->
  <text x="204" y="50" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#556B82" letter-spacing="2.2">
    TECHNOLOGY FOR EVERY NEED
  </text>
</svg>
