<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="700" height="500" rx="16" fill="#F8FAFC" />
  
  <!-- Diagnostic Lab Illustration -->
  <g transform="translate(60, 40)" filter="url(#shadowBox)">
    <rect width="580" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" />
    
    <!-- Header inside inspection visual -->
    <rect x="0" y="0" width="580" height="60" rx="16" fill="url(#aboutGrad)" />
    <rect x="0" y="45" width="580" height="15" fill="url(#aboutGrad)" />
    <text x="30" y="38" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">30-Point Quality Diagnostic Lifecycle</text>
    
    <!-- Step 1: Corporate Procurement -->
    <g transform="translate(30, 80)">
      <rect width="160" height="140" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="35" cy="35" r="18" fill="#EFF6FF" />
      <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563EB">01</text>
      <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">Sourcing</text>
      <text x="20" y="96" font-family="sans-serif" font-size="11" fill="#64748B">Direct tier-1 corporate & enterprise lease returns.</text>
    </g>

    <!-- Step 2: 30-Point QC & Thermal -->
    <g transform="translate(210, 80)">
      <rect width="160" height="140" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="35" cy="35" r="18" fill="#FEF3C7" />
      <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#D97706">02</text>
      <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">Deep Diagnostics</text>
      <text x="20" y="96" font-family="sans-serif" font-size="11" fill="#64748B">Motherboard, RAM, SSD health & thermal paste renewal.</text>
    </g>

    <!-- Step 3: Grade Certification -->
    <g transform="translate(390, 80)">
      <rect width="160" height="140" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
      <circle cx="35" cy="35" r="18" fill="#ECFDF5" />
      <text x="35" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10B981">03</text>
      <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="700" fill="#1E293B">Cosmetic Care</text>
      <text x="20" y="96" font-family="sans-serif" font-size="11" fill="#64748B">Ultrasonic sanitation & pristine Grade A finishing.</text>
    </g>

    <!-- Lower Interactive Checklist Details -->
    <g transform="translate(30, 240)">
      <rect width="520" height="150" rx="10" fill="#F1F5F9" />
      <text x="25" y="32" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1E293B">KEY CHECKPOINTS PASSED BEFORE DISPATCH</text>
      
      <!-- Check list items -->
      <g transform="translate(25, 45)">
        <circle cx="8" cy="8" r="7" fill="#10B981" />
        <path d="M 5 8 L 7 10 L 11 6" stroke="#fff" stroke-width="1.5" fill="none" />
        <text x="24" y="12" font-family="sans-serif" font-size="12" fill="#334155">Battery Health ≥ 80% with Stress Discharge Test</text>

        <circle cx="8" cy="33" r="7" fill="#10B981" />
        <path d="M 5 33 L 7 35 L 11 31" stroke="#fff" stroke-width="1.5" fill="none" />
        <text x="24" y="37" font-family="sans-serif" font-size="12" fill="#334155">Display Dead Pixel, Tint & Backlight Bleed Scan</text>

        <circle cx="8" cy="58" r="7" fill="#10B981" />
        <path d="M 5 58 L 7 60 L 11 56" stroke="#fff" stroke-width="1.5" fill="none" />
        <text x="24" y="62" font-family="sans-serif" font-size="12" fill="#334155">Keyboard 100-Key Actuation, Trackpad & Ports Verification</text>

        <circle cx="8" cy="83" r="7" fill="#10B981" />
        <path d="M 5 83 L 7 85 L 11 81" stroke="#fff" stroke-width="1.5" fill="none" />
        <text x="24" y="87" font-family="sans-serif" font-size="12" fill="#334155">Genuine Windows License & Driver Optimization</text>
      </g>
    </g>
  </g>
</svg>
